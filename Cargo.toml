[package]
name = "schemagen"
version = "0.2.0"
edition = "2024"
authors = ["LcBert <luca.bertaggia82@gmail.com>"]
description = "A fast and flexible fake/mock data generator library for Rust with JSON, JSONL, CSV, and SQL export support."
license = "MIT OR Apache-2.0"
repository = "https://github.com/LcBert/schemagen"
homepage = "https://github.com/LcBert/schemagen"
documentation = "https://docs.rs/schemagen"
readme = "README.md"
keywords = ["mock", "fake-data", "generator", "schema", "test-data"]
categories = ["development-tools::testing", "encoding"]


[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
indexmap = { version = "2.14.2", features = ["serde"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.1", features = ["v4", "v7", "serde"] }
